<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录页预览</title>
    <style>
      :root {
        --bg: #eef2f7;
        --panel: rgba(255, 255, 255, 0.82);
        --panel-border: rgba(255, 255, 255, 0.6);
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #2f6bff;
        --primary-dark: #2459db;
        --input: #ffffff;
        --shadow: 0 30px 80px rgba(15, 23, 42, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          linear-gradient(135deg, rgba(239, 244, 255, 0.9), rgba(244, 247, 252, 0.88)),
          url("https://mdn.alipayobjects.com/yuyan_qk0oxh/afts/img/V-_oS6r-i7wAAAAAAAAAAAAAFl94AQBr")
            center / cover fixed;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 16% 18%, rgba(255, 255, 255, 0.44), transparent 22%),
          radial-gradient(circle at 82% 30%, rgba(120, 170, 255, 0.18), transparent 20%),
          linear-gradient(180deg, rgba(250, 252, 255, 0.35), rgba(238, 243, 250, 0.08));
        pointer-events: none;
      }

      .page {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .topbar {
        position: fixed;
        right: 18px;
        top: 18px;
        z-index: 10;
      }

      .lang {
        border: 0;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.78);
        color: #1f2937;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(14px);
        font-size: 14px;
      }

      .shell {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(280px, 1.2fr) minmax(420px, 520px);
        align-items: center;
        gap: 56px;
        width: min(1180px, calc(100vw - 64px));
        margin: 0 auto;
        padding: 52px 0 36px;
      }

      .brand {
        color: #fff;
        text-shadow: 0 10px 30px rgba(15, 23, 42, 0.35);
      }

      .brand-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.24);
        backdrop-filter: blur(12px);
        font-size: 14px;
        letter-spacing: 0;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #fefefe, #cfe0ff);
        display: grid;
        place-items: center;
        color: #2459db;
        font-weight: 800;
      }

      .brand h1 {
        margin: 20px 0 14px;
        font-size: 56px;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .brand p {
        margin: 0;
        max-width: 520px;
        font-size: 18px;
        line-height: 1.8;
        color: rgba(255, 255, 255, 0.86);
      }

      .stats {
        margin-top: 30px;
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
      }

      .stat {
        min-width: 152px;
        padding: 16px 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(12px);
      }

      .stat strong {
        display: block;
        font-size: 22px;
        margin-bottom: 6px;
      }

      .stat span {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.78);
      }

      .panel {
        justify-self: end;
        width: 100%;
        max-width: 440px;
        padding: 30px 30px 26px;
        border-radius: 26px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(22px);
      }

      .panel-head {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
      }

      .panel-logo {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: inset 0 0 0 1px rgba(47, 107, 255, 0.09);
      }

      .panel-logo img {
        width: 34px;
        height: 34px;
      }

      .panel-title h2 {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
      }

      .panel-title p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .form {
        display: grid;
        gap: 14px;
      }

      .field {
        height: 52px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        border-radius: 14px;
        background: var(--input);
        border: 1px solid #e6ebf3;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      .field svg {
        width: 18px;
        height: 18px;
        color: #7a8599;
        flex: none;
      }

      .field input {
        border: 0;
        outline: none;
        background: transparent;
        width: 100%;
        font-size: 15px;
        color: var(--text);
      }

      .field input::placeholder {
        color: #97a3b7;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 4px;
        font-size: 13px;
      }

      .actions a {
        color: var(--primary);
        text-decoration: none;
      }

      .actions a:hover {
        color: var(--primary-dark);
      }

      .submit {
        height: 52px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), #163ea8);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 16px 28px rgba(47, 107, 255, 0.26);
      }

      .submit:hover {
        background: linear-gradient(135deg, #3b7bff, var(--primary-dark));
      }

      .panel-foot {
        margin-top: 18px;
        display: flex;
        justify-content: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .panel-foot strong {
        color: var(--text);
      }

      .footer {
        padding: 0 0 20px;
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        letter-spacing: 0.2px;
      }

      @media (max-width: 980px) {
        .shell {
          grid-template-columns: 1fr;
          gap: 26px;
          width: min(720px, calc(100vw - 32px));
          padding-top: 88px;
        }

        .brand h1 {
          font-size: 40px;
        }

        .panel {
          justify-self: start;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <button class="lang">中 / EN</button>
      </div>

      <main class="shell">
        <section class="brand">
          <div class="brand-badge">
            <div class="brand-mark">绘</div>
            <span>绘梦工坊</span>
          </div>
          <h1>重新定义 AI 短剧工业化生产力</h1>
          <p>
            从创意、脚本、分镜到角色一致性视频生成，把短剧生产流程集中到一个工作台里，帮助团队更快完成协作和交付。
          </p>
          <div class="stats">
            <div class="stat">
              <strong>100%</strong>
              <span>角色一致性控制</span>
            </div>
            <div class="stat">
              <strong>3x</strong>
              <span>更快的制作节奏</span>
            </div>
            <div class="stat">
              <strong>24h</strong>
              <span>快速接入与试用</span>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div class="panel-logo">
              <img alt="logo" src="/logo.svg" />
            </div>
            <div class="panel-title">
              <h2>欢迎回来</h2>
              <p>登录后继续你的创作工作流</p>
            </div>
          </div>

          <form class="form">
            <label class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M4 20v-1.5A4.5 4.5 0 0 1 8.5 14h7A4.5 4.5 0 0 1 20 18.5V20" />
                <circle cx="12" cy="8" r="3.5" />
              </svg>
              <input type="text" placeholder="手机号" />
            </label>

            <label class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="5" y="11" width="14" height="8" rx="2" />
                <path d="M8 11V8a4 4 0 1 1 8 0v3" />
              </svg>
              <input type="password" placeholder="密码" />
            </label>

            <button class="submit" type="button">登录</button>

            <div class="actions">
              <label><input type="checkbox" checked /> 自动登录</label>
              <a href="#">注册新用户</a>
            </div>
          </form>

          <div class="panel-foot">
            <span>登录即表示你同意</span>
            <strong>服务协议</strong>
            <span>和</span>
            <strong>隐私政策</strong>
          </div>
        </section>
      </main>

      <footer class="footer">Ant Short TV</footer>
    </div>
  </body>
</html>
