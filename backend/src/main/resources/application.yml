server:
  port: 8080

spring:
  config:
    import: optional:file:./env[.properties]
  application:
    name: ant-short-tv-backend
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      validation-timeout: 5000
      keepalive-time: 300000
      max-lifetime: 1740000
      minimum-idle: 2
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:}

auth:
  session:
    token-pepper: ${AUTH_TOKEN_PEPPER}
    ttl: ${AUTH_SESSION_TTL:7d}
    activity-update-interval: ${AUTH_SESSION_ACTIVITY_INTERVAL:5m}
    cleanup-interval: ${AUTH_SESSION_CLEANUP_INTERVAL:PT1H}
    cleanup-retention: ${AUTH_SESSION_CLEANUP_RETENTION:30d}
    cookie-name: ${AUTH_SESSION_COOKIE_NAME:ANT_SHORT_SESSION}
    cookie-secure: ${AUTH_SESSION_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_SESSION_COOKIE_SAME_SITE:Lax}
  platform:
    initial-admin-mobile: ${PLATFORM_INITIAL_ADMIN_MOBILE:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

object-storage:
  mode: ${OBJECT_STORAGE_MODE:s3}
  endpoint: ${OBJECT_STORAGE_ENDPOINT:https://minio.aixmax.cn}
  bucket: ${OBJECT_STORAGE_BUCKET:ant-short-tv}
  access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
  secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
  region: ${OBJECT_STORAGE_REGION:}
  auto-create-bucket: ${OBJECT_STORAGE_AUTO_CREATE_BUCKET:true}

commercial:
  wechat:
    enabled: ${WECHAT_PAY_ENABLED:false}
    base-url: ${WECHAT_PAY_BASE_URL:https://api.mch.weixin.qq.com}
    app-id: ${WECHAT_PAY_APP_ID:}
    merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
    merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
    merchant-private-key-path: ${WECHAT_PAY_MERCHANT_PRIVATE_KEY_PATH:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}

ai:
  secret-key: ${AI_SECRET_KEY:}
  workflow-agent:
    skill-root: ${AI_WORKFLOW_SKILL_ROOT:skills}
    max-skill-file-bytes: ${AI_WORKFLOW_MAX_SKILL_FILE_BYTES:1048576}
    max-steps: ${AI_WORKFLOW_MAX_STEPS:20}
    run-timeout-seconds: ${AI_WORKFLOW_RUN_TIMEOUT_SECONDS:300}
    max-log-payload-bytes: ${AI_WORKFLOW_MAX_LOG_PAYLOAD_BYTES:262144}
    split-chunk-target-min: ${AI_WORKFLOW_SPLIT_CHUNK_TARGET_MIN:15000}
    split-chunk-target-max: ${AI_WORKFLOW_SPLIT_CHUNK_TARGET_MAX:20000}
    split-chunk-hard-max: ${AI_WORKFLOW_SPLIT_CHUNK_HARD_MAX:24000}
    split-chunk-overlap: ${AI_WORKFLOW_SPLIT_CHUNK_OVERLAP:1500}
    split-chunk-concurrency: ${AI_WORKFLOW_SPLIT_CHUNK_CONCURRENCY:3}
    split-safe-context-tokens: ${AI_WORKFLOW_SPLIT_SAFE_CONTEXT_TOKENS:800000}
    split-prompt-reserve-tokens: ${AI_WORKFLOW_SPLIT_PROMPT_RESERVE_TOKENS:12000}
    split-tool-reserve-tokens: ${AI_WORKFLOW_SPLIT_TOOL_RESERVE_TOKENS:24000}
    global-understanding-enabled: ${AI_WORKFLOW_GLOBAL_UNDERSTANDING_ENABLED:false}
    episode-splitting-enabled: ${AI_WORKFLOW_EPISODE_SPLITTING_ENABLED:false}
    episode-summary-enabled: ${AI_WORKFLOW_EPISODE_SUMMARY_ENABLED:false}
    asset-recognition-enabled: ${AI_WORKFLOW_ASSET_RECOGNITION_ENABLED:false}
    review-bootstrap-enabled: ${AI_WORKFLOW_REVIEW_BOOTSTRAP_ENABLED:true}
    review-quick-enabled: ${AI_WORKFLOW_REVIEW_QUICK_ENABLED:false}
    review-deep-enabled: ${AI_WORKFLOW_REVIEW_DEEP_ENABLED:false}
    fanout-concurrency: ${AI_WORKFLOW_FANOUT_CONCURRENCY:3}
  testing:
    mock-provider-enabled: ${AI_TESTING_MOCK_PROVIDER_ENABLED:false}
  execution:
    dispatcher:
      enabled: ${AI_EXECUTION_DISPATCHER_ENABLED:true}
      batch-size: ${AI_EXECUTION_DISPATCHER_BATCH_SIZE:20}
      fixed-delay-ms: ${AI_EXECUTION_DISPATCHER_FIXED_DELAY_MS:5000}
    claim-timeout: ${AI_EXECUTION_CLAIM_TIMEOUT:PT10M}
    max-concurrent-per-tenant: ${AI_EXECUTION_MAX_CONCURRENT_PER_TENANT:5}
    worker-threads: ${AI_EXECUTION_WORKER_THREADS:4}
    queue-capacity: ${AI_EXECUTION_QUEUE_CAPACITY:100}
  video:
    storage-root: ${AI_VIDEO_STORAGE_ROOT:storage}
    max-concurrent-per-tenant: ${AI_VIDEO_MAX_CONCURRENT_PER_TENANT:3}
    task-timeout-minutes: ${AI_VIDEO_TASK_TIMEOUT_MINUTES:20}
    poll-retry-limit: ${AI_VIDEO_POLL_RETRY_LIMIT:3}
    due-task-batch-size: ${AI_VIDEO_DUE_TASK_BATCH_SIZE:20}
    poll-fixed-delay-ms: ${AI_VIDEO_POLL_FIXED_DELAY_MS:15000}
    scheduler:
      enabled: ${AI_VIDEO_SCHEDULER_ENABLED:true}

review:
  workflow:
    quick-safe-characters: ${REVIEW_WORKFLOW_QUICK_SAFE_CHARACTERS:50000}
    deep-unit-characters: ${REVIEW_WORKFLOW_DEEP_UNIT_CHARACTERS:24000}
    deep-unit-overlap: ${REVIEW_WORKFLOW_DEEP_UNIT_OVERLAP:1200}
    deep-max-concurrency: ${REVIEW_WORKFLOW_DEEP_MAX_CONCURRENCY:3}
