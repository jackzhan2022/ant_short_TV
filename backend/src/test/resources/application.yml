spring:
  datasource:
    url: jdbc:h2:mem:ant_short_tv;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=0
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

object-storage:
  mode: local
  endpoint: https://minio.aixmax.cn
  bucket: ant-short-tv
  access-key: test-access-key
  secret-key: test-secret-key

ai:
  secret-key: test-ai-secret-key

auth:
  session:
    token-pepper: test-auth-token-pepper-at-least-32-characters
    ttl: 12h
    activity-update-interval: 5m
    cleanup-interval: PT1H
    cleanup-retention: 30d
    cookie-secure: false
  platform:
    initial-admin-mobile: "13800000999"
